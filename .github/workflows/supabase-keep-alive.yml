name: Supabase Keep Alive

on:
  schedule:
    # Run at 00:00 UTC every 2 days (prevents Supabase inactivity pause)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Missing NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub Secrets."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Pinging Supabase REST API at $CLEAN_URL..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$CLEAN_URL/rest/v1/scores?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase! Project is active."
          else
            echo "Failed to ping Supabase (HTTP $HTTP_STATUS)."
            exit 1
          fi
